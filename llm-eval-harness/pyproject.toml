[project]
name = "evalkit"
version = "1.0.0"
description = "Lightweight evaluation harness for LLM applications with regression gating for CI."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
