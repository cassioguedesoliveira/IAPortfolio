# docker compose up --build   ->   UI at http://localhost:4200
# Optional: ANTHROPIC_API_KEY=... LLM_PROVIDER=anthropic docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings   # demo only; use a secret in real deployments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/meetings
      DB_USER: meetings
      DB_PASSWORD: meetings
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
