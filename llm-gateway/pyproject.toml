[project]
name = "llm-gateway"
version = "1.0.0"
description = "Resilient gateway for LLM providers: caching, rate limiting, retries, circuit breaking, fallback and cost tracking."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
