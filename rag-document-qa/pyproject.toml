[project]
name = "ragqa"
version = "1.0.0"
description = "Retrieval-Augmented Generation over your own documents, with citations and refusal guardrails."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=0.40"]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
